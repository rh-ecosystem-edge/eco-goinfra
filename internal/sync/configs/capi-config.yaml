---
# Cannot be automatically synced because the local types are a minimal
# subset of sigs.k8s.io/cluster-api v1beta1 Cluster types, defined
# locally to avoid pulling in the full cluster-api module dependency.
#
# Only the Cluster, ClusterSpec, ClusterStatus, APIEndpoint, and
# ObjectReference types are included — enough for CAPI Cluster CRUD.
- name: capi-cluster-v1beta1
  sync: false
  repo_link: "https://github.com/kubernetes-sigs/cluster-api"
  branch: main
  remote_api_directory: api/core/v1beta1
  local_api_directory: schemes/capi/cluster/v1beta1
  excludes:
    - "*_test.go"
